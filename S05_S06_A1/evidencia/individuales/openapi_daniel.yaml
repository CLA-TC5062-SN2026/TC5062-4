components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        correlationId:
          type: string
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    AuthResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - email
      - name
      - role
      - emailVerified
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - CAREGIVER
          - CO_CAREGIVER
          - DOCTOR
          - ADMIN
        emailVerified:
          type: boolean
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - name
      - adultDeclaration
      - healthDataConsent
      - minorDataConsent
      - privacyNoticeVersion
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        adultDeclaration:
          type: boolean
        healthDataConsent:
          type: boolean
        minorDataConsent:
          type: boolean
        privacyNoticeVersion:
          type: string
    PrivacyConsentRequest:
      type: object
      required:
      - version
      - accepted
      properties:
        version:
          type: string
        accepted:
          type: boolean
          enum:
          - true
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
