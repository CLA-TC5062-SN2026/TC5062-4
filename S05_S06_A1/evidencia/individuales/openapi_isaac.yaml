openapi: 3.0.3
info:
  title: DAFI — API REST (contrato spec-first)
  version: 1.0.0
  description: Contrato de API para DAFI v1, derivado de SRS_equipo.md v3.0 y backlog_completo.md. DAFI no
    diagnostica, clasifica urgencias ni genera indicaciones médicas. Los mensajes e indicaciones son responsabilidad
    de los participantes. x-acceptance-criteria liga cada operación con criterios del SRS; las validaciones
    UI y procesos automáticos se listan por separado en x-non-http-acceptance-criteria. La selección de proveedor
    cloud, correo e IA sigue pendiente.
servers:
- url: https://api.dafi.example/api/v1
  description: URL de ejemplo; sustituir antes del despliegue
tags:
- name: Autenticacion
- name: Cuentas
- name: Familias
- name: Perfiles
- name: Consentimientos
- name: Cuidadores
- name: Medicos
- name: Permisos
- name: Catalogos
- name: Conversaciones
- name: Eventos
- name: Fotos
- name: Indicaciones
- name: Historial
- name: Resumen
- name: Notificaciones
- name: Privacidad
- name: Reportes
- name: Administracion
security:
- bearerAuth: []
paths:
  /public/info:
    get:
      tags:
      - Catalogos
      summary: Información pública, límites del sistema y aviso fijo
      operationId: get_public_info
      description: Información pública, límites del sistema y aviso fijo
      x-acceptance-criteria:
      - RF-01-AC-6
      - RF-13-AC-1
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  descripcion:
                    type: string
                  avisoEmergencias:
                    type: string
                  numeroEmergencias:
                    type: string
                required:
                - descripcion
                - avisoEmergencias
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters: []
  /auth/register:
    post:
      tags:
      - Autenticacion
      summary: Registrar cuidador y familia
      operationId: post_auth_register
      description: Registrar cuidador y familia
      x-acceptance-criteria:
      - RF-01-AC-1
      - RF-01-AC-2
      - RF-01-AC-3
      responses:
        '201':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registro'
      parameters: []
  /auth/login:
    post:
      tags:
      - Autenticacion
      summary: Iniciar sesión y aplicar bloqueo por IP
      operationId: post_auth_login
      description: Iniciar sesión y aplicar bloqueo por IP
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-02-AC-2
      - RF-02-AC-3
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
      parameters: []
  /auth/logout:
    post:
      tags:
      - Autenticacion
      summary: Revocar sesión vigente de forma idempotente
      operationId: post_auth_logout
      description: Se revoca el token cuando existe; en ausencia de sesión también responde 204 y no crea sesión.
      x-acceptance-criteria:
      - RF-02-AC-4
      - RF-02-AC-5
      responses:
        '204':
          description: Respuesta exitosa
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters: []
  /auth/verify-email:
    post:
      tags:
      - Autenticacion
      summary: Confirmar correo de registro
      operationId: post_auth_verify_email
      description: Confirmar correo de registro
      x-acceptance-criteria:
      - RF-01-AC-4
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      parameters: []
  /auth/password-reset-requests:
    post:
      tags:
      - Autenticacion
      summary: Solicitar enlace de recuperación sin revelar cuenta
      operationId: post_auth_password_reset_requests
      description: Solicitar enlace de recuperación sin revelar cuenta
      x-acceptance-criteria:
      - RF-03-AC-1
      responses:
        '202':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                correo:
                  type: string
                  format: email
              required:
              - correo
      parameters: []
  /auth/password-resets:
    post:
      tags:
      - Autenticacion
      summary: Restablecer contraseña con token de un solo uso
      operationId: post_auth_password_resets
      description: Restablecer contraseña con token de un solo uso
      x-acceptance-criteria:
      - RF-03-AC-2
      - RF-03-AC-3
      - RF-03-AC-4
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                nuevaContrasena:
                  type: string
                  minLength: 8
              required:
              - token
              - nuevaContrasena
      parameters: []
  /me:
    get:
      tags:
      - Cuentas
      summary: Consultar usuario y aceptación de aviso
      operationId: get_me
      description: Consultar usuario y aceptación de aviso
      x-acceptance-criteria:
      - RF-01-AC-5
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters: []
    patch:
      tags:
      - Cuentas
      summary: Editar nombre del usuario
      operationId: patch_me
      description: Editar nombre del usuario
      x-acceptance-criteria:
      - RF-03-AC-6
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
              required:
              - nombre
      parameters: []
    delete:
      tags:
      - Privacidad
      summary: Eliminar cuenta familiar y registrar informe de borrado
      operationId: delete_me
      description: 'Solo cuidador principal: elimina físicamente la cuenta familiar, perfiles, conversaciones
        y fotos; revoca sesiones, conserva solo registros mínimos y devuelve informe de eliminación. El cliente
        exige escribir ELIMINAR; la API vuelve a comprobarlo en X-Delete-Confirmation.'
      x-acceptance-criteria:
      - RF-21-AC-4
      - RF-21-AC-5
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeEliminacion'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Delete-Confirmation
        in: header
        required: true
        description: Confirmación explícita del cuidador principal; nunca se incluye en la URL.
        schema:
          type: string
          enum:
          - ELIMINAR
  /me/privacy-consents:
    post:
      tags:
      - Cuentas
      summary: Aceptar nueva versión del aviso
      operationId: post_me_privacy_consents
      description: Aceptar nueva versión del aviso
      x-acceptance-criteria:
      - RF-01-AC-5
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                versionAviso:
                  type: string
                acepta:
                  type: boolean
              required:
              - versionAviso
              - acepta
      parameters: []
  /me/privacy:
    get:
      tags:
      - Privacidad
      summary: Panel privacidad, permisos y retención
      operationId: get_me_privacy
      description: Panel privacidad, permisos y retención
      x-acceptance-criteria:
      - RF-21-AC-6
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  perfiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Perfil'
                  diasRetencionRespaldo:
                    type: integer
                  avisoPrivacidadUrl:
                    type: string
                required:
                - perfiles
                - diasRetencionRespaldo
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters: []
  /families/me:
    get:
      tags:
      - Familias
      summary: Consultar familia del cuidador
      operationId: get_families_me
      description: Consultar familia del cuidador
      x-acceptance-criteria:
      - RF-01-AC-1
      - RF-06-AC-2
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Familia'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters: []
  /families/me/profiles:
    get:
      tags:
      - Perfiles
      summary: Listar perfiles visibles de la familia
      operationId: get_families_me_profiles
      description: Listar perfiles visibles de la familia
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-06-AC-2
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Perfil'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters: []
    post:
      tags:
      - Perfiles
      summary: Crear perfil y gestionar consentimiento según tipo
      operationId: post_families_me_profiles
      description: Crear perfil y gestionar consentimiento según tipo
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-04-AC-2
      - RF-04-AC-3
      - RF-04-AC-5
      - RF-05-AC-1
      - RF-07-AC-5
      responses:
        '201':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilInput'
      parameters: []
  /profiles/{profileId}:
    get:
      tags:
      - Perfiles
      summary: Consultar perfil autorizado
      operationId: get_profiles_profileId
      description: Consultar perfil autorizado
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-10-AC-5
      - RF-22-AC-2
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador UUID de profileId
    patch:
      tags:
      - Perfiles
      summary: Actualizar perfil y datos usados en resumen
      operationId: patch_profiles_profileId
      description: Actualizar perfil y datos usados en resumen
      x-acceptance-criteria:
      - RF-04-AC-3
      - RF-04-AC-4
      responses:
        '200':
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                alergias:
                  type: array
                  items:
                    type: string
                medicamentos:
                  type: array
                  items:
                    type: string
                compartirConCocuidador:
                  type: boolean
      parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador UUID de profileId
    delete:
      tags:
      - Privacidad
      summary: Eliminar perfil y datos vinculados
      operationId: delete_profiles_profileId
      description: Eliminar perfil y datos vinculados
      x-acceptance-criteria:
      - RF-21-AC-4
      - RF-05-AC-4
      - RF-04-AC-3
      - RF-22-AC-2
      responses:
        '204':
          description: Respuesta exitosa
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin permisos o cuenta no verificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto, límite o transición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
