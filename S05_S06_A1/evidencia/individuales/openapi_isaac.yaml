x-non-http-acceptance-criteria:
  RF-10-AC-2: El navegador construye y deduplica cuestionario desde GET /catalog/tags.
  RF-11-AC-1: El cliente convierte HEIC a JPEG y elimina EXIF; POST /photos valida resultado.
  RF-11-AC-6: El cliente muestra advertencia antes de abrir cámara; API protege visualización de imágenes.
  RF-11-AC-7: Validación local de tamaño/formato original antes de subir JPEG.
  RF-12-AC-1: Checklist y deshabilitar botón es UI; POST /send valida de nuevo.
  RF-13-AC-2: Identidad del aviso entre respuestas diferentes es una prueba de UI y catálogo fijo.
  RF-13-AC-3: Comportamiento visual del aviso en conversaciones cerradas.
  RF-15-AC-3: Cierre por cron cada 15 minutos; no endpoint público para ejecutar scheduler.
  RF-17-AC-2: El chequeo de citas del servicio LLM ocurre dentro del backend, no en ruta aparte.
  RF-19-AC-1: Correo se emite desde evento guardar indicación; no endpoint para enviar correos arbitrarios.
  RF-19-AC-2: Correo se emite tras enviar conversación con prioridad.
  RF-20-AC-1: Aviso temporal automático por worker; GET /notifications permite consultarlo.
  RF-20-AC-2: 'No enviar aviso después de apertura del médico: condición de worker.'
  RF-20-AC-3: 'Plazo de 30 minutos por prioridad: condición de worker.'
  RF-23-AC-2: El botón Reintentar es UI; Idempotency-Key protege reintentos en rutas POST.
