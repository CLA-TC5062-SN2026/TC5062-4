components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT sujeto a revocación de sesión, expiración por inactividad y aceptación vigente del aviso
        de privacidad.
  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
          enum:
          - NO_AUTENTICADO
          - SIN_PERMISOS
          - CUENTA_NO_VERIFICADA
          - NO_ENCONTRADO
          - TRANSICION_INVALIDA
          - LIMITE_ALCANZADO
          - CONSENTIMIENTO_PENDIENTE
          - ARCHIVO_INVALIDO
          - DATOS_INVALIDOS
          - FOTO_RECHAZADA
          - CONVERSACION_INCOMPLETA
          - BLOQUEADO
          - ERROR_INTERNO
        mensaje:
          type: string
        correlationId:
          type: string
        campos:
          type: array
          items:
            type: string
      required:
      - codigo
      - mensaje
      - correlationId
    Mensaje:
      type: object
      properties:
        mensaje:
          type: string
      required:
      - mensaje
    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        correo:
          type: string
          format: email
        rol:
          type: string
          enum:
          - CUIDADOR
          - COCUIDADOR
          - MEDICO
          - ADMINISTRADOR
        activo:
          type: boolean
      required:
      - id
      - nombre
      - correo
      - rol
    Sesion:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
      - accessToken
      - tokenType
      - expiresIn
      - usuario
    Familia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cuidadorPrincipalId:
          type: string
          format: uuid
        cocuidadorId:
          type: string
          format: uuid
        fechaCreacion:
          type: string
          format: date-time
      required:
      - id
      - cuidadorPrincipalId
    Perfil:
      type: object
      properties:
        id:
          type: string
          format: uuid
        familiaId:
          type: string
          format: uuid
        nombre:
          type: string
        fechaNacimiento:
          type: string
          format: date
        edad:
          type: integer
        tipo:
          type: string
          enum:
          - MENOR
          - PROPIO_CUIDADOR
          - ADULTO_REPRESENTADO
        alergias:
          type: array
          items:
            type: string
        medicamentos:
          type: array
          items:
            type: string
        compartirConCocuidador:
          type: boolean
        resumenHabilitado:
          type: boolean
        estadoConsentimiento:
          type: string
          enum:
          - PENDIENTE
          - ACEPTADO
          - REVOCADO
      required:
      - id
      - familiaId
      - nombre
      - fechaNacimiento
      - tipo
    MedicoCirculo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        medicoId:
          type: string
          format: uuid
        familiaId:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - PENDIENTE
          - ACEPTADA
          - RECHAZADA
        nombre:
          type: string
        leyenda:
          type: string
          example: Contacto agregado por usted
      required:
      - id
      - familiaId
