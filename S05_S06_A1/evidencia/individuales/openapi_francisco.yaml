openapi: 3.0.3
info:
  title: DAFI API
  version: 1.1.0
  description: |
    Contrato de la API del backend de DAFI (Node.js con Express y MongoDB).

    Esta especificación es spec-first: precede al código de S05-S06 y a las pruebas de S09.
    Cada operación declara en `x-acceptance-criteria` los criterios Given-When-Then del
    SRS de equipo v3.0 (`S03_A1/SRS_equipo.md`) que satisface.

    **Autenticación.** Bearer token JWT (HS256) con `sub` (usuario), `rol`, `familiaId` y
    `jti`. La API guarda el `jti` con su última actividad, de modo que la sesión expira tras
    `MINUTOS_SESION` minutos sin peticiones y se revoca al cerrar sesión, al restablecer la
    contraseña o al borrar la cuenta (RF-02-AC-4, RF-03-AC-3, RNF-05).

    **Autorización.** La matriz de roles de la sección 3.0 del SRS se verifica antes de
    buscar el recurso: si al rol le falta la operación responde 403 `SIN_PERMISOS`; si el
    recurso es de otra familia o el médico no puede verlo responde 404 `NO_ENCONTRADO`.

    **Errores.** Todo rechazo usa el esquema `Error` con un código del contrato de errores
    y el identificador de correlación, también en la cabecera `X-Correlation-Id`. La
    frontera entre códigos de validación es fija:

    - 400 `SOLICITUD_MALFORMADA`: el cuerpo no se puede leer como JSON, un parámetro de
      query viola su esquema o falta una cabecera obligatoria (`Idempotency-Key`).
    - 404 `NO_ENCONTRADO`: un identificador de path con formato inválido se trata como
      inexistente, para no revelar el formato de los identificadores.
    - 413 / 415 `ARCHIVO_INVALIDO`: cuerpo demasiado grande / tipo de contenido no admitido.
    - 422: el JSON es legible pero viola el esquema o una regla de negocio.

    **Idempotencia.** Las operaciones POST con efectos que no deben repetirse (enviar una
    conversación, subir fotos, enviar mensajes, pedir información, registrar indicaciones
    e invitar) exigen la cabecera `Idempotency-Key`. Una repetición con la misma clave y el
    mismo cuerpo devuelve el código y el cuerpo originales con `Idempotency-Replayed: true`
    y sin duplicar efectos (RF-23-AC-3); la misma clave con otro cuerpo responde 422 y una
    repetición mientras la original sigue en curso responde 409. GET, PUT y DELETE son
    idempotentes por definición: repetir un PUT no genera eventos nuevos si el valor no
    cambió, y un DELETE sobre un recurso ya borrado responde 404.

    **PATCH.** Los PATCH usan JSON Merge Patch (RFC 7396, `application/merge-patch+json`):
    los campos ausentes no cambian y los arreglos se reemplazan completos.

    **Concurrencia.** Cuidador y cocuidador pueden editar el mismo borrador. Las
    respuestas de lectura de conversaciones y respuestas llevan `ETag`; las escrituras
    aceptan `If-Match` y responden 412 si el recurso cambió entretanto.

    **Paginación.** Las colecciones que pueden crecer sin límite aceptan `pagina` y
    `limite` y devuelven `{datos, paginacion}`. Las colecciones acotadas por diseño
    (miembros de una familia, perfiles, invitaciones, familias de un médico) devuelven
    un arreglo.
  contact:
    name: Francisco Martínez Álvarez (A01840483), Equipo 4
  x-criterios-fuera-de-api:
    - id: RF-11-AC-6
      motivo: Aviso que el cliente muestra antes de abrir la cámara; no hay petición a la API.
    - id: RF-11-AC-7
      motivo: Validación de tamaño y formato del original en el cliente, antes de convertirlo.
    - id: RF-15-AC-3
      motivo: Cierre automático por proceso programado; su efecto se observa en GET /conversaciones/{conversacionId}.
    - id: RF-20-AC-1
      motivo: Aviso por proceso programado; su efecto se observa en GET /notificaciones.
    - id: RF-20-AC-2
      motivo: Aviso por proceso programado; su efecto se observa en GET /notificaciones.
    - id: RF-20-AC-3
      motivo: Aviso por proceso programado; su efecto se observa en GET /notificaciones.

servers:
  - url: http://localhost:4000/api/v1
    description: Desarrollo local
  - url: https://dafi-api.onrender.com/api/v1
    description: Ambiente del curso (Render)

security:
  - bearerAuth: []

tags:
  - name: Autenticación y cuenta
    description: Registro, sesiones, verificación de correo, restablecimiento y datos de la propia cuenta (RF-01 a RF-03).
  - name: Familias
    description: Familia, miembros, círculo médico, privacidad y borrado de la cuenta familiar (RF-06 a RF-08, RF-21).
  - name: Invitaciones
    description: Invitaciones a cocuidador y médicos (RF-06, RF-07). El registro por invitación está en `POST /registros`.
  - name: Perfiles
    description: Perfiles de paciente, consentimiento de adultos, permisos de historial e historial (RF-04, RF-05, RF-08, RF-18).
  - name: Conversaciones
    description: Apertura (bajo el perfil), edición del borrador, envío, redirección, cierre, bandeja y borrado (RF-09, RF-12, RF-16, RF-21).
  - name: Contenido de conversación
    description: Preguntas de contexto, respuestas, fotos, mensajes, solicitudes, indicaciones, eventos y accesos (RF-10, RF-11, RF-14, RF-15, RF-18, RNF-08).
  - name: Resumen de contexto
    description: Resumen con citas verificables para el médico (RF-17, RF-23).
  - name: Notificaciones
    description: Notificaciones dentro de la app (RF-19, RF-20).
  - name: Reportes y administración
    description: Reportes de abuso y técnicos, desactivación de cuentas (RF-22).
  - name: Catálogos
    description: Etiquetas, preguntas y avisos fijos (RF-01-AC-6, RF-13, RNF-11).
  - name: Operación
    description: Estado del servicio para el monitor de disponibilidad (RNF-10).

paths:
  # ───────────────────────── Autenticación y cuenta ─────────────────────────
  /sesiones:
    post:
      tags: [Autenticación y cuenta]
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: |
        Devuelve un JWT y la pantalla de inicio del rol. Las credenciales incorrectas
        responden siempre igual, exista o no el correo. Tras `MAX_INTENTOS_LOGIN` fallos
        consecutivos para un correo desde una IP, esa IP queda bloqueada `MINUTOS_BLOQUEO`
        minutos y, si la cuenta existe, su titular recibe un correo.
      security: []
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-3, RF-22-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciales' }
      responses:
        '201':
          description: Sesión creada.
          headers:
            Location:
              description: Siempre `/sesiones/actual`.
              schema: { type: string, example: /api/v1/sesiones/actual }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionCreada' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401':
          description: Credenciales incorrectas («Los datos no coinciden»).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                codigo: NO_AUTENTICADO
                mensaje: Los datos no coinciden
                correlacionId: 7f1c2e9a-5b0d-4c1e-9a33-2d6f0f6b8e11
        '403':
          description: Cuenta desactivada por el administrador (`CUENTA_DESACTIVADA`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /sesiones/actual:
    delete:
      tags: [Autenticación y cuenta]
      operationId: cerrarSesion
      summary: Cerrar la sesión actual
      description: |
        Revoca el `jti` del token. Es idempotente: sin token, con un token ya revocado o
        expirado responde igual 204, no crea sesión y no devuelve error interno.
      security:
        - bearerAuth: []
        - {}
      x-acceptance-criteria: [RF-02-AC-4, RF-02-AC-5]
      responses:
        '204': { description: Sesión cerrada o inexistente. }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /registros:
    post:
      tags: [Autenticación y cuenta]
      operationId: registrarCuenta
      summary: Crear una cuenta (cuidador principal o por invitación)
      description: |
        Un solo punto de registro con dos formas de cuerpo:

        - `RegistroFamilia` (sin `tokenInvitacion`): crea la familia y la cuenta del
          cuidador principal en una transacción, guarda versión y fecha del aviso, envía el
          enlace de verificación de correo y exige las tres declaraciones de RF-01.
        - `RegistroPorInvitacion` (con `tokenInvitacion`): crea la cuenta de cocuidador o de
          médico según la invitación. El cocuidador exige las tres declaraciones; el médico,
          la aceptación de los términos de uso para médicos. El correo queda verificado
          porque el enlace llegó a él.

        En ambos casos abre la sesión y responde con ella.
      security: []
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-2, RF-01-AC-3, RF-06-AC-2, RF-07-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegistroFamilia'
                - $ref: '#/components/schemas/RegistroPorInvitacion'
      responses:
        '201':
          description: Cuenta creada; sesión abierta.
          headers:
            Location:
              description: Siempre `/cuenta`, la cuenta recién creada.
              schema: { type: string, example: /api/v1/cuenta }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionCreada' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '409':
          description: Ya existe una cuenta con este correo (`CORREO_REGISTRADO`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                codigo: CORREO_REGISTRADO
                mensaje: Ya existe una cuenta con este correo.
                correlacionId: 0b8e3d55-1f2a-4f0e-8c71-93a1d2e4c6f0
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422':
          description: |
            Falta una declaración o un campo es inválido (`DATOS_INVALIDOS`, `campos` lista
            cuáles), o el enlace de invitación venció o ya se usó (`ENLACE_INVALIDO`).
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                codigo: DATOS_INVALIDOS
                mensaje: Necesitamos esta autorización para usar DAFI.
                correlacionId: 4a6c1b2e-90d3-4b7f-8e15-6f2c0a9d3b44
                campos:
                  - campo: declaraciones.consentimientoDatosMenores
                    mensaje: Necesitamos esta autorización para usar DAFI.
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /familias:
    get:
      tags: [Familias]
      operationId: listarFamilias
      summary: Listar las familias del usuario
      description: |
        Para cuidador y cocuidador devuelve su familia. Para el médico devuelve las familias
        de cuyo círculo forma parte, con el nombre de la familia (sirve al filtro de bandeja).
      x-acceptance-criteria: [RF-07-AC-3, RF-16-AC-4]
      responses:
        '200':
          description: Familias visibles para el usuario.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FamiliaResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /verificaciones-correo:
    post:
      tags: [Autenticación y cuenta]
      operationId: verificarCorreo
      summary: Confirmar el correo con el enlace recibido
      description: |
        Marca el correo como verificado. Mientras no se verifique, enviar conversaciones o
        invitaciones responde `CUENTA_NO_VERIFICADA`; crear perfiles y borradores sí se permite.
        El token viaja en el cuerpo para que no quede en los registros de acceso (RNF-13).
      security: []
      x-acceptance-criteria: [RF-01-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenEnlace' }
      responses:
        '204': { description: Correo verificado. }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /restablecimientos-contrasena:
    post:
      tags: [Autenticación y cuenta]
      operationId: solicitarRestablecimiento
      summary: Solicitar un enlace para restablecer la contraseña
      description: |
        Responde 202 exista o no la cuenta («Si el correo está registrado, recibirá un
        enlace.»). Si existe, envía un enlace de un solo uso válido por
        `MINUTOS_ENLACE_RESTABLECER` minutos.
      security: []
      x-acceptance-criteria: [RF-03-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo]
              properties:
                correo: { type: string, format: email, example: ana@example.com }
      responses:
        '202': { description: Solicitud recibida. La respuesta no revela si la cuenta existe. }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /restablecimientos-contrasena/confirmaciones:
    post:
      tags: [Autenticación y cuenta]
      operationId: confirmarRestablecimiento
      summary: Fijar la contraseña nueva con el enlace de restablecimiento
      description: |
        Cambia la contraseña y revoca todas las sesiones de la cuenta. Un enlace vencido
        o ya usado responde 422 `ENLACE_INVALIDO` con `motivo` (`vencido` o `usado`).
      security: []
      x-acceptance-criteria: [RF-03-AC-2, RF-03-AC-3, RF-03-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, contrasenaNueva]
              properties:
                token: { type: string, minLength: 32 }
                contrasenaNueva: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Contraseña cambiada; sesiones revocadas. }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /cuenta:
    get:
      tags: [Autenticación y cuenta]
      operationId: obtenerCuenta
      summary: Consultar la propia cuenta
      description: |
        Devuelve rol, estado de verificación y si hay una versión del aviso de privacidad
        pendiente de aceptar. El cliente la usa para decidir la pantalla de inicio.
      x-acceptance-criteria: [RF-01-AC-5, RF-02-AC-1]
      responses:
        '200':
          description: Cuenta del usuario autenticado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    patch:
      tags: [Autenticación y cuenta]
      operationId: actualizarCuenta
      summary: Editar el nombre de la propia cuenta
      description: El correo no se edita en la versión 1. El nombre nuevo se ve en conversaciones abiertas y anteriores.
      x-acceptance-criteria: [RF-03-AC-6]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                nombre: { type: string, minLength: 1, maxLength: 80 }
                especialidad: { type: string, maxLength: 80, description: Solo para médicos. }
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /cuenta/cambios-contrasena:
    post:
      tags: [Autenticación y cuenta]
      operationId: cambiarContrasena
      summary: Cambiar la contraseña con sesión abierta
      description: |
        Requiere la contraseña actual. Si es correcta, cambia la contraseña, revoca las demás
        sesiones y envía un correo de aviso. Si es incorrecta responde `DATOS_INVALIDOS`
        (422 y no 401, para que el cliente no lo interprete como sesión vencida). Es POST y
        no PUT porque no es idempotente: repetir la petición falla, ya que la contraseña
        «actual» cambió, y cada cambio revoca sesiones y envía correo.
      x-acceptance-criteria: [RF-03-AC-5]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasenaActual, contrasenaNueva]
              properties:
                contrasenaActual: { type: string, format: password }
                contrasenaNueva: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Contraseña cambiada. }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /cuenta/aceptaciones-aviso:
    post:
      tags: [Autenticación y cuenta]
      operationId: aceptarAvisoPrivacidad
      summary: Aceptar una versión nueva del aviso de privacidad
      description: |
        Registra usuario, versión, fecha y hora. Mientras haya una versión pendiente, enviar
        conversaciones o mensajes responde 403 `AVISO_PENDIENTE`.
      x-acceptance-criteria: [RF-01-AC-5]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1, example: 2 }
      responses:
        '201':
          description: Aceptación registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AceptacionAviso' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Familias ─────────────────────────────
  /familias/{familiaId}:
    parameters:
      - $ref: '#/components/parameters/familiaId'
    get:
      tags: [Familias]
      operationId: obtenerFamilia
      summary: Consultar una familia
      x-acceptance-criteria: [RF-06-AC-2]
      responses:
        '200':
          description: Datos de la familia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamiliaResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      tags: [Familias]
      operationId: eliminarFamilia
      summary: Eliminar la cuenta familiar
      description: |
        Solo el cuidador principal. Borra físicamente familia, perfiles, conversaciones,
        fotos y la cuenta del cocuidador, cierra sus sesiones y conserva las cuentas de los
        médicos y el registro mínimo de conversaciones enviadas. La confirmación «ELIMINAR»
        se captura en el cliente. Devuelve el resumen de lo borrado, que también se envía
        por correo.
      x-acceptance-criteria: [RF-21-AC-4, RF-21-AC-5]
      responses:
        '200':
          description: Familia eliminada; resumen de lo borrado y lo conservado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenBorrado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /familias/{familiaId}/miembros:
    parameters:
      - $ref: '#/components/parameters/familiaId'
    get:
      tags: [Familias]
      operationId: listarMiembros
      summary: Listar cuidadores y círculo médico
      description: |
        Cada médico lleva la leyenda «Contacto agregado por usted». Con `rol=medico` y lista
        vacía, el cliente muestra «Agregue primero a un médico de su confianza».
      x-acceptance-criteria: [RF-07-AC-3, RF-09-AC-3]
      parameters:
        - name: rol
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Rol' }
      responses:
        '200':
          description: Miembros de la familia.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Miembro' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /familias/{familiaId}/miembros/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/familiaId'
      - $ref: '#/components/parameters/usuarioId'
    delete:
      tags: [Familias]
      operationId: quitarMiembro
      summary: Quitar a un miembro o salir de la familia
      description: |
        El cuidador principal quita al cocuidador o a un médico. El cocuidador y el médico
        pueden quitarse a sí mismos. Al salir, el cocuidador pierde el acceso y su cuenta se
        borra; las conversaciones que registró se conservan. Al salir un médico, sus
        conversaciones `ENVIADA`, `EN_REVISION` o `INFO_SOLICITADA` pasan a `SIN_MEDICO`.
      x-acceptance-criteria: [RF-06-AC-4, RF-06-AC-5, RF-08-AC-3]
      responses:
        '204': { description: Miembro quitado. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /familias/{familiaId}/privacidad:
    parameters:
      - $ref: '#/components/parameters/familiaId'
    get:
      tags: [Familias]
      operationId: obtenerPrivacidad
      summary: Consultar la sección «Privacidad»
      description: |
        Datos que DAFI guarda de cada perfil, médicos que pueden verlo (con «Compartir
        historial»), estado del resumen automático, retención de respaldos y enlace al aviso
        vigente.
      x-acceptance-criteria: [RF-21-AC-6]
      responses:
        '200':
          description: Estado de privacidad de la familia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Privacidad' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ──────────────────────────── Invitaciones ────────────────────────────
  /familias/{familiaId}/invitaciones:
    parameters:
      - $ref: '#/components/parameters/familiaId'
    get:
      tags: [Invitaciones]
      operationId: listarInvitacionesEnviadas
      summary: Listar las invitaciones enviadas por la familia
      description: Muestra «Esperando respuesta» (`pendiente`) o «El médico no aceptó la invitación» (`rechazada`).
      x-acceptance-criteria: [RF-07-AC-1, RF-07-AC-4]
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoInvitacion' }
      responses:
        '200':
          description: Invitaciones de la familia.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitacion' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Invitaciones]
      operationId: invitar
      summary: Invitar a un cocuidador o a un médico
      description: |
        Solo el cuidador principal con correo verificado. Envía un enlace válido por
        `DIAS_INVITACION` días. Si la familia ya tiene cocuidador, una invitación de tipo
        `cocuidador` responde `LIMITE_ALCANZADO`.
      x-acceptance-criteria: [RF-01-AC-4, RF-06-AC-1, RF-06-AC-3, RF-07-AC-1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitacionNueva' }
      responses:
        '201':
          description: Invitación creada y enviada.
          headers:
            Location:
              description: URL de la invitación.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitacion' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /invitaciones:
    get:
      tags: [Invitaciones]
      operationId: listarInvitacionesRecibidas
      summary: Listar las invitaciones recibidas por el médico autenticado
      x-acceptance-criteria: [RF-07-AC-3]
      parameters:
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoInvitacion' }
      responses:
        '200':
          description: Invitaciones dirigidas al usuario.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitacion' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /invitaciones/{invitacionId}:
    parameters:
      - $ref: '#/components/parameters/invitacionId'
    get:
      tags: [Invitaciones]
      operationId: obtenerInvitacion
      summary: Consultar una invitación
      description: Visible para el cuidador principal que la envió y para el médico al que va dirigida.
      x-acceptance-criteria: [RF-07-AC-1, RF-07-AC-4]
      responses:
        '200':
          description: Invitación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    patch:
      tags: [Invitaciones]
      operationId: responderInvitacion
      summary: Aceptar o rechazar una invitación (médico con cuenta)
      description: |
        Al aceptar, la familia aparece en la lista del médico y el médico en el círculo con la
        leyenda «Contacto agregado por usted». Al rechazar, el médico no queda en el círculo.
        Una invitación `vencida`, `cancelada` o ya respondida responde 409
        `TRANSICION_INVALIDA`.
      x-acceptance-criteria: [RF-07-AC-3, RF-07-AC-4]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [aceptada, rechazada]
      responses:
        '200':
          description: Invitación respondida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitacion' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      tags: [Invitaciones]
      operationId: cancelarInvitacion
      summary: Cancelar una invitación pendiente (cuidador principal)
      x-acceptance-criteria: []
      responses:
        '204': { description: Invitación cancelada. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Perfiles ─────────────────────────────
  /familias/{familiaId}/perfiles:
    parameters:
      - $ref: '#/components/parameters/familiaId'
    get:
      tags: [Perfiles]
      operationId: listarPerfiles
      summary: Listar los perfiles de la familia
      description: |
        Incluye la edad calculada en años. El cocuidador ve los perfiles de menores y los de
        adulto que tengan «Compartir con el cocuidador».
      x-acceptance-criteria: [RF-04-AC-1, RF-06-AC-2]
      responses:
        '200':
          description: Perfiles visibles para el usuario.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Perfiles]
      operationId: crearPerfil
      summary: Crear un perfil de paciente
      description: |
        Solo el cuidador principal. Un perfil de tipo `menor` con 18 años o más se rechaza con
        `DATOS_INVALIDOS` y `sugerencia: agregar_adulto`. Un perfil `adulto_representado`
        exige correo, queda `pendiente_consentimiento` y dispara el correo de consentimiento.
      x-acceptance-criteria: [RF-04-AC-1, RF-04-AC-2, RF-04-AC-3, RF-04-AC-5, RF-05-AC-1, RF-07-AC-5]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilNuevo' }
      responses:
        '201':
          description: Perfil creado.
          headers:
            Location:
              description: URL del perfil.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /perfiles/{perfilId}:
    parameters:
      - $ref: '#/components/parameters/perfilId'
    get:
      tags: [Perfiles]
      operationId: obtenerPerfil
      summary: Consultar un perfil
      description: El administrador recibe `SIN_PERMISOS`.
      x-acceptance-criteria: [RF-22-AC-2]
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    patch:
      tags: [Perfiles]
      operationId: actualizarPerfil
      summary: Editar un perfil
      description: |
        Solo el cuidador principal. Cambiar alergias o medicamentos se refleja en el grupo
        «Alergias y medicamentos» del resumen con la fuente «Perfil». `resumenActivo: false`
        desactiva el resumen automático para el perfil.
      x-acceptance-criteria: [RF-04-AC-3, RF-04-AC-4, RF-17-AC-5]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/PerfilActualizacion' }
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      tags: [Perfiles]
      operationId: eliminarPerfil
      summary: Eliminar un perfil con sus conversaciones y fotos
      description: Solo el cuidador principal. Borrado físico (RNF-07).
      x-acceptance-criteria: [RF-04-AC-3]
      responses:
        '204': { description: Perfil eliminado. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /perfiles/{perfilId}/conversaciones:
    parameters:
      - $ref: '#/components/parameters/perfilId'
    get:
      tags: [Perfiles]
      operationId: obtenerHistorial
      summary: Historial del paciente
      description: |
        Conversaciones del perfil, de la más reciente a la más antigua, con estado, etiquetas,
        médico, fecha e indicaciones vigentes. La familia ve todo; el médico, las dirigidas a
        él y, con «Compartir historial», las demás en solo lectura. Lista vacía con 200.

        Se distingue de `GET /conversaciones` en el alcance: aquí el eje es el paciente e
        incluye lo compartido; allá el eje es el usuario (bandeja del médico o lista de la
        familia) y solo incluye lo dirigido al médico.
      x-acceptance-criteria: [RF-08-AC-2, RF-18-AC-1, RF-18-AC-2, RF-18-AC-4]
      parameters:
        - $ref: '#/components/parameters/filtroEtiqueta'
        - name: medicoId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ObjectId' }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Historial paginado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaConversaciones' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Conversaciones]
      operationId: abrirConversacion
      summary: Abrir una conversación en borrador para el perfil
      description: |
        Cuidador o cocuidador. Crea la conversación en `BORRADOR` con de una a tres
        etiquetas, médico del círculo, título y prioridad opcional; el perfil sale del path,
        igual que los perfiles se crean bajo su familia. La respuesta incluye las preguntas de
        contexto de las etiquetas y el aviso de emergencias. Un médico recibe `SIN_PERMISOS`.
        Acepta `Idempotency-Key` opcional para que un reintento no abra dos borradores.
      x-acceptance-criteria: [RF-07-AC-5, RF-09-AC-1, RF-09-AC-2, RF-13-AC-1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOpcional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversacionNueva' }
      responses:
        '201':
          description: Conversación creada en `BORRADOR`.
          headers:
            Location:
              description: URL de la conversación (`/conversaciones/{conversacionId}`).
              schema: { type: string }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversacionDetalle' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /perfiles/{perfilId}/permisos-historial:
    parameters:
      - $ref: '#/components/parameters/perfilId'
    get:
      tags: [Perfiles]
      operationId: listarPermisosHistorial
      summary: Ver qué médicos tienen «Compartir historial» para el perfil
      x-acceptance-criteria: [RF-08-AC-2]
      responses:
        '200':
          description: Un permiso por médico del círculo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermisoHistorial' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /perfiles/{perfilId}/permisos-historial/{medicoId}:
    parameters:
      - $ref: '#/components/parameters/perfilId'
      - $ref: '#/components/parameters/medicoId'
    put:
      tags: [Perfiles]
      operationId: fijarPermisoHistorial
      summary: Activar o apagar «Compartir historial» para un médico
      description: |
        Idempotente: repetir la misma petición deja el mismo estado. Determina qué ve el
        médico en el historial y qué eventos se envían al módulo de resumen.
      x-acceptance-criteria: [RF-08-AC-1, RF-08-AC-2, RF-17-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compartirHistorial]
              properties:
                compartirHistorial: { type: boolean }
      responses:
        '200':
          description: Permiso fijado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermisoHistorial' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /consentimientos:
    post:
      tags: [Perfiles]
      operationId: otorgarConsentimiento
      summary: El adulto representado da su consentimiento
      description: |
        Pública: el adulto representado no tiene cuenta. Activa el perfil, guarda fecha y
        versión del aviso, avisa al cuidador principal y envía un correo de confirmación con
        el enlace permanente de revocación.
      security: []
      x-acceptance-criteria: [RF-05-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, avisoVersion]
              properties:
                token: { type: string, minLength: 32 }
                avisoVersion: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Consentimiento registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimiento' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /consentimientos/revocaciones:
    post:
      tags: [Perfiles]
      operationId: revocarConsentimiento
      summary: El adulto representado revoca su consentimiento
      description: |
        Borra el perfil, sus conversaciones y sus fotos (RF-21) y avisa al cuidador y a los
        médicos que atendían sus conversaciones.
      security: []
      x-acceptance-criteria: [RF-05-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tokenRevocacion]
              properties:
                tokenRevocacion: { type: string, minLength: 32 }
      responses:
        '204': { description: Consentimiento revocado y datos borrados. }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '429': { $ref: '#/components/responses/Bloqueado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ─────────────────────────── Conversaciones ───────────────────────────
  /conversaciones:
    get:
      tags: [Conversaciones]
      operationId: listarConversaciones
      summary: Bandeja del médico o lista de conversaciones de la familia
      description: |
        Para el médico devuelve solo las conversaciones dirigidas a él, cada una con su
        `seccionBandeja` y ordenadas del evento sin atender más antiguo al más reciente
        («Esperando a la familia» por fecha de la solicitud). Para cuidador y cocuidador
        devuelve las conversaciones de su familia que pueden ver.
      x-acceptance-criteria: [RF-16-AC-1, RF-16-AC-3, RF-16-AC-4]
      parameters:
        - name: familiaId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ObjectId' }
        - name: seccion
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SeccionBandeja' }
        - name: estado
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EstadoConversacion' }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Conversaciones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaConversaciones' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    get:
      tags: [Conversaciones]
      operationId: obtenerConversacion
      summary: Detalle de una conversación
      description: |
        Operación segura: no cambia el estado. Incluye perfil, etiquetas, respuestas, fotos,
        indicaciones vigentes, `puntosPendientes` de la revisión previa al envío y si el
        cliente debe fijar el aviso de emergencias (`mostrarAvisoEmergencias`). Un médico
        que no puede ver la conversación recibe `NO_ENCONTRADO`; el administrador,
        `SIN_PERMISOS`.
      x-acceptance-criteria: [RF-08-AC-1, RF-12-AC-1, RF-13-AC-2, RF-13-AC-3, RF-15-AC-1, RF-22-AC-2]
      responses:
        '200':
          description: Conversación.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversacionDetalle' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    patch:
      tags: [Conversaciones]
      operationId: editarBorrador
      summary: Editar un borrador
      description: |
        Cuidador o cocuidador, solo en `BORRADOR` (en otro estado responde
        `TRANSICION_INVALIDA`). Cambia `titulo`, `etiquetas` (más de tres responde
        `LIMITE_ALCANZADO`), `medicoId` y `prioridadIndicada`. No cambia el estado: el envío y
        el cierre son recursos propios. Con `If-Match` evita pisar los cambios del otro
        cuidador.
      x-acceptance-criteria: [RF-09-AC-2, RF-09-AC-4]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ConversacionActualizacion' }
      responses:
        '200':
          description: Borrador actualizado.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversacionDetalle' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/PrecondicionFallida' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      tags: [Conversaciones]
      operationId: eliminarConversacion
      summary: Eliminar una conversación completa
      description: |
        Cuidador o cocuidador. Borra físicamente la conversación, sus fotos y sus eventos. Si
        ya se había enviado, avisa al médico y conserva el registro mínimo (identificador,
        fecha de envío y fecha de borrado).
      x-acceptance-criteria: [RF-21-AC-2, RF-21-AC-3]
      responses:
        '204': { description: Conversación eliminada. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/envios:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    post:
      tags: [Conversaciones]
      operationId: enviarConversacion
      summary: Enviar un borrador o redirigir una conversación sin médico
      description: |
        Cuidador o cocuidador. Registra un envío según la tabla de transiciones del SRS (3.0):

        - Desde `BORRADOR`, sin cuerpo: pasa a `ENVIADA`. Requiere los tres puntos de RF-12
          (si faltan, `CONVERSACION_INCOMPLETA` con `puntosFaltantes`), correo verificado
          (`CUENTA_NO_VERIFICADA`), aviso de privacidad vigente aceptado (`AVISO_PENDIENTE`)
          y consentimiento del adulto representado (`CONSENTIMIENTO_PENDIENTE`; el borrador
          se conserva). Notifica al médico; con prioridad, con el asunto de RF-19-AC-2.
        - Desde `SIN_MEDICO`, con `medicoId`: la redirige a otro médico del círculo y pasa a
          `ENVIADA` con todos sus eventos.

        En cualquier otro estado responde `TRANSICION_INVALIDA`. La clave de idempotencia es
        obligatoria: un reintento devuelve el mismo resultado sin duplicar el envío.
      x-acceptance-criteria: [RF-01-AC-4, RF-01-AC-5, RF-05-AC-2, RF-08-AC-4, RF-09-AC-4, RF-12-AC-2, RF-12-AC-3, RF-19-AC-2, RF-23-AC-3]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvioNuevo' }
      responses:
        '200':
          description: |
            Envío aplicado; la conversación quedó en `ENVIADA`. Responde 200 y no 201 porque
            no crea un recurso consultable: el envío queda como evento de cambio de estado.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversacionDetalle' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/cierre:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    put:
      tags: [Conversaciones]
      operationId: cerrarConversacion
      summary: Cerrar una conversación
      description: |
        Cuidador o cocuidador, desde `ENVIADA`, `EN_REVISION`, `INFO_SOLICITADA` o
        `CON_INDICACIONES`. Es idempotente: cerrar una conversación ya `CERRADA` responde 200
        con el mismo cierre y no registra otro evento. Desde `BORRADOR` o `SIN_MEDICO`
        responde `TRANSICION_INVALIDA`. Una conversación cerrada no se reabre.
      x-acceptance-criteria: []
      x-requerimientos: [RF-15]
      responses:
        '200':
          description: Conversación cerrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cierre' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ─────────────────────── Contenido de conversación ───────────────────────
  /conversaciones/{conversacionId}/preguntas:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    get:
      tags: [Contenido de conversación]
      operationId: listarPreguntas
      summary: Preguntas de contexto de la conversación
      description: |
        Generales más las de cada etiqueta, sin repetir. Incluye alergias y medicamentos del
        perfil como referencia para G3 y la respuesta guardada de cada pregunta.
      x-acceptance-criteria: [RF-10-AC-2, RF-10-AC-5]
      responses:
        '200':
          description: Cuestionario de la conversación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuestionario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/preguntas/{preguntaId}/respuesta:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
      - $ref: '#/components/parameters/preguntaId'
    get:
      tags: [Contenido de conversación]
      operationId: obtenerRespuesta
      summary: Consultar la respuesta a una pregunta de contexto
      description: 404 si la pregunta aún no tiene respuesta o no pertenece a las etiquetas de la conversación.
      x-acceptance-criteria: [RF-10-AC-1]
      responses:
        '200':
          description: Respuesta guardada.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Respuesta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    put:
      tags: [Contenido de conversación]
      operationId: responderPregunta
      summary: Guardar la respuesta a una pregunta de contexto
      description: |
        Solo en `BORRADOR` (después de enviar, las respuestas son de solo lectura y responde
        `TRANSICION_INVALIDA`). Es idempotente: registra un evento con fecha y autor solo
        cuando el valor cambia, así que repetir el mismo PUT no altera el historial. La
        primera respuesta responde 201 y las siguientes 200. El valor numérico de F1 se
        guarda sin interpretación. G3 con «Sí» sin texto responde `DATOS_INVALIDOS` con
        «Cuéntenos qué medicamento tomó.» Con `If-Match` evita pisar la respuesta del otro
        cuidador.
      x-acceptance-criteria: [RF-10-AC-1, RF-10-AC-3, RF-10-AC-4]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespuestaEntrada' }
      responses:
        '200':
          description: Respuesta reemplazada (o sin cambios).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Respuesta' }
        '201':
          description: Respuesta creada por primera vez.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Respuesta' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '412': { $ref: '#/components/responses/PrecondicionFallida' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/fotos:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    post:
      tags: [Contenido de conversación]
      operationId: subirFoto
      summary: Agregar una foto
      description: |
        Cuidador o cocuidador, en `BORRADOR` o `INFO_SOLICITADA`. El cuerpo es el JPEG ya
        convertido por el cliente. La API rechaza con `ARCHIVO_INVALIDO` un cuerpo de más de
        1 048 576 bytes (413) y uno que no es JPEG, ya sea por `Content-Type` o porque sus
        bytes iniciales no son los de un JPEG (415). Después vuelve a quitar el EXIF, valida
        nitidez y brillo (`FOTO_RECHAZADA` con `motivo`) y el límite de `MAX_FOTOS`.
      x-acceptance-criteria: [RF-11-AC-1, RF-11-AC-2, RF-11-AC-3, RF-11-AC-4, RF-11-AC-5, RF-23-AC-3]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Foto agregada.
          headers:
            Location:
              description: URL de la foto.
              schema: { type: string }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Foto' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '413': { $ref: '#/components/responses/ArchivoDemasiadoGrande' }
        '415': { $ref: '#/components/responses/ArchivoInvalido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/fotos/{fotoId}:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
      - $ref: '#/components/parameters/fotoId'
    get:
      tags: [Contenido de conversación]
      operationId: obtenerFoto
      summary: Descargar una foto a través de la API
      description: |
        Solo para quien puede ver la conversación; no hay URL públicas. Registra el acceso
        del médico (RNF-08). Las fotos de zona sensible se entregan con
        `Content-Disposition: inline` y `Cache-Control: no-store` para el visor sin descarga.
      x-acceptance-criteria: [RF-22-AC-2]
      responses:
        '200':
          description: Imagen JPEG sin EXIF.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, no-store' }
            Content-Disposition:
              description: Siempre `inline`; nunca `attachment`.
              schema: { type: string, example: inline }
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    delete:
      tags: [Contenido de conversación]
      operationId: eliminarFoto
      summary: Eliminar una foto de un borrador
      description: |
        Solo en `BORRADOR`: borra la foto de la conversación y del almacenamiento. Si la
        conversación ya se envió responde `TRANSICION_INVALIDA` y el cliente ofrece borrar la
        conversación completa.
      x-acceptance-criteria: [RF-21-AC-1, RF-21-AC-2]
      responses:
        '204': { description: Foto eliminada. }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/mensajes:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    post:
      tags: [Contenido de conversación]
      operationId: enviarMensaje
      summary: Enviar un mensaje o responder una solicitud de información
      description: |
        Familia o médico al que va dirigida. Un mensaje no cambia el estado, salvo cuando la
        familia responde (`respondeASolicitud: true`) una conversación `INFO_SOLICITADA`,
        que vuelve a `EN_REVISION`. En `CERRADA` responde `TRANSICION_INVALIDA`.
      x-acceptance-criteria: [RF-14-AC-2, RF-14-AC-3, RF-14-AC-4, RF-23-AC-2, RF-23-AC-3]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MensajeNuevo' }
      responses:
        '201':
          description: Mensaje registrado como evento.
          headers:
            Location:
              description: URL del evento creado (`/conversaciones/{conversacionId}/eventos/{eventoId}`).
              schema: { type: string }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/solicitudes-informacion:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    post:
      tags: [Contenido de conversación]
      operationId: pedirInformacion
      summary: El médico pide más fotos o información
      description: |
        Desde `EN_REVISION` o `CON_INDICACIONES`; la conversación pasa a `INFO_SOLICITADA` y
        la familia recibe una notificación con el texto.
      x-acceptance-criteria: [RF-14-AC-1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudInformacionNueva' }
      responses:
        '201':
          description: Solicitud registrada como evento.
          headers:
            Location:
              description: URL del evento creado (`/conversaciones/{conversacionId}/eventos/{eventoId}`).
              schema: { type: string }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/indicaciones:
