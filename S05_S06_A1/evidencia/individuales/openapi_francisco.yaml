      x-acceptance-criteria: [RF-15-AC-1, RF-15-AC-2, RF-15-AC-4, RF-15-AC-5, RF-19-AC-1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndicacionNueva' }
      responses:
        '201':
          description: Indicaciones registradas.
          headers:
            Location:
              description: URL del evento creado (`/conversaciones/{conversacionId}/eventos/{eventoId}`).
              schema: { type: string }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicacion' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/eventos:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    get:
      tags: [Contenido de conversación]
      operationId: listarEventos
      summary: Eventos de la conversación en orden cronológico
      description: Respuestas, mensajes, fotos, solicitudes, indicaciones (también las sustituidas) y cambios de estado, cada uno con fecha, hora y autor.
      x-acceptance-criteria: [RF-14-AC-4, RF-15-AC-4, RF-18-AC-3]
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Eventos paginados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEventos' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/eventos/{eventoId}:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
      - $ref: '#/components/parameters/eventoId'
    get:
      tags: [Contenido de conversación]
      operationId: obtenerEvento
      summary: Consultar un evento
      description: |
        Destino del `Location` de mensajes, solicitudes e indicaciones, y del enlace de cada
        cita del resumen de contexto, que lleva al mensaje de origen.
      x-acceptance-criteria: [RF-17-AC-1]
      responses:
        '200':
          description: Evento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/accesos:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    get:
      tags: [Contenido de conversación]
      operationId: listarAccesos
      summary: Registro de accesos del médico («Visto por»)
      x-acceptance-criteria: []
      x-requerimientos: [RNF-08]
      parameters:
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Accesos registrados, del más reciente al más antiguo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAccesos' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Contenido de conversación]
      operationId: registrarAcceso
      summary: El médico registra que abrió la conversación
      description: |
        El cliente del médico lo llama al cargar el detalle. Registra quién y cuándo
        (RNF-08). El primer acceso a una conversación `ENVIADA` la pasa a `EN_REVISION` y la
        familia ve «Su médico está revisando la conversación.» Los accesos siguientes solo
        se registran. Responde 201 sin `Location` porque un acceso no se consulta por
        separado: se lee en la colección `GET /accesos`.
      x-acceptance-criteria: [RF-16-AC-2]
      x-requerimientos: [RNF-08]
      responses:
        '201':
          description: Acceso registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acceso' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ─────────────────────────── Resumen de contexto ───────────────────────────
  /conversaciones/{conversacionId}/resumen:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
    get:
      tags: [Resumen de contexto]
      operationId: obtenerResumen
      summary: Resumen de contexto para el médico
      description: |
        Solo el médico. Los datos del perfil van directo con la fuente «Perfil». El resto son
        citas textuales que la API verifica (evento existente, visible para el médico y texto
        idéntico) antes de devolverlas; las que no cumplen se descartan. Se genera al
        consultarlo y se regenera si hay eventos nuevos. `estado` distingue `disponible`,
        `desactivado_por_familia` y `no_disponible` (tiempo de espera de
        `TIMEOUT_RESUMEN_S` agotado o error del módulo).
      x-acceptance-criteria: [RF-04-AC-4, RF-17-AC-1, RF-17-AC-2, RF-17-AC-3, RF-17-AC-4, RF-17-AC-5, RF-23-AC-1]
      responses:
        '200':
          description: Resumen (también cuando no está disponible o está desactivado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenContexto' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /conversaciones/{conversacionId}/resumen/citas/{citaId}:
    parameters:
      - $ref: '#/components/parameters/conversacionId'
      - $ref: '#/components/parameters/citaId'
    patch:
      tags: [Resumen de contexto]
      operationId: marcarCita
      summary: El médico marca una cita como «No es correcto»
      description: |
        La cita deja de mostrarse en esa conversación y se registra un evento para las
        métricas de RNF-09. El `citaId` es estable entre regeneraciones del resumen (ver
        `Cita.id`), así que la marca sobrevive aunque el resumen se regenere. Es idempotente:
        marcar una cita ya marcada responde 200 sin registrar otro evento.
      x-acceptance-criteria: [RF-17-AC-6]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [marcadaIncorrecta]
              properties:
                marcadaIncorrecta:
                  type: boolean
                  enum: [true]
      responses:
        '200':
          description: Cita marcada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cita' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ─────────────────────────── Notificaciones ───────────────────────────
  /notificaciones:
    get:
      tags: [Notificaciones]
      operationId: listarNotificaciones
      summary: Notificaciones dentro de la app
      description: |
        Incluye solicitudes de información, indicaciones, avisos de consentimiento, salida
        del cocuidador y el aviso por falta de respuesta que genera el proceso programado de
        RF-20.
      x-acceptance-criteria: [RF-05-AC-3, RF-06-AC-5, RF-14-AC-1, RF-20-AC-1, RF-20-AC-2, RF-20-AC-3]
      parameters:
        - name: leida
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Notificaciones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaNotificaciones' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /notificaciones/{notificacionId}:
    parameters:
      - $ref: '#/components/parameters/notificacionId'
    patch:
      tags: [Notificaciones]
      operationId: marcarNotificacion
      summary: Marcar una notificación como leída
      x-acceptance-criteria: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [leida]
              properties:
                leida: { type: boolean }
      responses:
        '200':
          description: Notificación actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notificacion' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ─────────────────────── Reportes y administración ───────────────────────
  /reportes:
    get:
      tags: [Reportes y administración]
      operationId: listarReportes
      summary: Listar reportes (administrador)
      description: Motivo, fecha y cuentas involucradas; nunca mensajes, fotos ni datos de pacientes.
      x-acceptance-criteria: [RF-22-AC-1, RF-22-AC-4]
      parameters:
        - name: tipo
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoReporte' }
        - name: atendido
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/pagina'
        - $ref: '#/components/parameters/limite'
      responses:
        '200':
          description: Reportes paginados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaReportes' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Reportes y administración]
      operationId: crearReporte
      summary: Reportar abuso o un problema técnico
      x-acceptance-criteria: [RF-22-AC-1, RF-22-AC-4]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOpcional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReporteNuevo' }
      responses:
        '201':
          description: Reporte recibido («Recibimos su reporte»).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reporte' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /reportes/{reporteId}:
    parameters:
      - $ref: '#/components/parameters/reporteId'
    patch:
      tags: [Reportes y administración]
      operationId: atenderReporte
      summary: Marcar un reporte como atendido (administrador)
      x-acceptance-criteria: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [atendido]
              properties:
                atendido: { type: boolean }
      responses:
        '200':
          description: Reporte actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reporte' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /usuarios/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/usuarioId'
    patch:
      tags: [Reportes y administración]
      operationId: cambiarEstadoCuenta
      summary: Desactivar o reactivar una cuenta (administrador)
      description: |
        Al desactivar, revoca todas las sesiones de la cuenta. Si es un médico, sus
        conversaciones `ENVIADA`, `EN_REVISION` o `INFO_SOLICITADA` pasan a `SIN_MEDICO`.
      x-acceptance-criteria: [RF-22-AC-3]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '200':
          description: Estado de la cuenta actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioAdmin' }
        '400': { $ref: '#/components/responses/SolicitudMalformada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermisos' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '415': { $ref: '#/components/responses/TipoNoAdmitido' }
        '422': { $ref: '#/components/responses/DatosInvalidos' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  # ───────────────────────────── Operación ─────────────────────────────
  /salud:
    get:
      tags: [Operación]
      operationId: obtenerSalud
      summary: Estado del servicio
      description: |
        Pública. La consulta el monitor de disponibilidad cada 5 minutos, lo que además
        evita que Render suspenda la API por inactividad (RNF-10). Comprueba la conexión a
        MongoDB con un `ping`; no revela datos de usuarios ni la configuración.
      security: []
      x-acceptance-criteria: []
      x-requerimientos: [RNF-10]
      responses:
        '200':
          description: La API y la base de datos responden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: "La API responde pero la base de datos no (`estado: degradado`)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  # ───────────────────────────── Catálogos ─────────────────────────────
  /etiquetas:
    get:
      tags: [Catálogos]
      operationId: listarEtiquetas
      summary: Catálogo de etiquetas con sus preguntas de contexto
      description: Se carga al desplegar; agregar una etiqueta no cambia los endpoints (RNF-11).
      security: []
      x-acceptance-criteria: [RF-10-AC-2]
      x-requerimientos: [RNF-11]
      responses:
        '200':
          description: Etiquetas vigentes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Etiqueta' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /avisos/{codigo}:
    parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          enum: [emergencias, que-es-dafi, sin-respuesta, privacidad]
    get:
      tags: [Catálogos]
      operationId: obtenerAviso
      summary: Texto fijo de un aviso del catálogo
      description: |
        Pública. `emergencias` es el aviso fijo de RF-13 (idéntico en toda conversación);
        `que-es-dafi` es la pantalla pública de RF-01-AC-6; `privacidad` devuelve la versión
        vigente del aviso de privacidad.
      security: []
      x-acceptance-criteria: [RF-01-AC-6, RF-13-AC-1, RF-13-AC-2]
      responses:
        '200':
          description: Aviso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aviso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado con HS256. Claims: `sub`, `rol`, `familiaId` (nulo para médico y
        administrador), `jti`, `iat`, `exp`. La API rechaza con `NO_AUTENTICADO` un `jti`
        revocado o con más de `MINUTOS_SESION` minutos sin actividad.

  headers:
    X-Correlation-Id:
      description: Identificador de correlación de la petición (también en el cuerpo del error).
      schema: { type: string, format: uuid }
    ETag:
      description: Versión del recurso (derivada de `__v` o de `updatedAt`); se reenvía en `If-Match`.
      schema: { type: string, example: 'W/"7"' }
    Idempotency-Replayed:
      description: Presente y en `true` cuando la respuesta es la repetición de una petición ya procesada con la misma `Idempotency-Key`.
      schema: { type: boolean }

  parameters:
    familiaId:
      name: familiaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    perfilId:
      name: perfilId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    conversacionId:
      name: conversacionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    fotoId:
      name: fotoId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    usuarioId:
      name: usuarioId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    medicoId:
      name: medicoId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    invitacionId:
      name: invitacionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    citaId:
      name: citaId
      in: path
      required: true
      description: Identificador estable de la cita (ver `Cita.id`).
      schema: { $ref: '#/components/schemas/IdCita' }
    eventoId:
      name: eventoId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    reporteId:
      name: reporteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    notificacionId:
      name: notificacionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    preguntaId:
      name: preguntaId
      in: path
      required: true
      description: Código de la pregunta del catálogo (G1, P2, F1…).
      schema: { type: string, pattern: '^[A-Z][0-9]{1,2}$', example: G3 }
    filtroEtiqueta:
      name: etiqueta
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CodigoEtiqueta' }
    pagina:
      name: pagina
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    limite:
      name: limite
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clave generada por el cliente, única por usuario y válida `HORAS_IDEMPOTENCIA` horas.
        Si falta responde 400. Una repetición con la misma clave y el mismo cuerpo devuelve
        el código y el cuerpo originales con `Idempotency-Replayed: true`; la misma clave con
        otro cuerpo responde 422 y una repetición mientras la original sigue en curso, 409.
      schema: { type: string, format: uuid }
    IdempotencyKeyOpcional:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional; si viene, se aplican las mismas reglas que en `IdempotencyKey`.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Valor de `ETag` leído antes de editar. Si el recurso cambió desde entonces, responde 412.
      schema: { type: string }

  responses:
    SolicitudMalformada:
      description: |
        El cuerpo no se puede leer como JSON, un parámetro de query viola su esquema o falta
        una cabecera obligatoria como `Idempotency-Key` (`SOLICITUD_MALFORMADA`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: SOLICITUD_MALFORMADA
            mensaje: La solicitud no tiene un formato válido.
            correlacionId: 1d2c3b4a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    NoAutenticado:
      description: Sesión inexistente, revocada o expirada (`NO_AUTENTICADO`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: NO_AUTENTICADO
            mensaje: Su sesión terminó. Inicie sesión de nuevo.
            correlacionId: 2e3d4c5b-6a7f-4b8c-9d0e-1f2a3b4c5d6e
    SinPermisos:
      description: |
        El rol no tiene la operación (`SIN_PERMISOS`), el correo no está verificado
        (`CUENTA_NO_VERIFICADA`) o hay un aviso de privacidad pendiente (`AVISO_PENDIENTE`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: SIN_PERMISOS
            mensaje: No tiene permiso para esta acción.
            correlacionId: 3f4e5d6c-7b8a-4c9d-8e0f-2a3b4c5d6e7f
    NoEncontrado:
      description: Recurso inexistente, de otra familia o que el médico no puede ver (`NO_ENCONTRADO`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: NO_ENCONTRADO
            mensaje: No encontramos lo que busca.
            correlacionId: 4a5f6e7d-8c9b-4d0e-9f1a-3b4c5d6e7f8a
    Conflicto:
      description: |
        Conflicto con el estado actual: `TRANSICION_INVALIDA`, `LIMITE_ALCANZADO`,
        `CONSENTIMIENTO_PENDIENTE`, `CORREO_REGISTRADO` o una petición con la misma
        `Idempotency-Key` que sigue en curso (`SOLICITUD_EN_CURSO`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: TRANSICION_INVALIDA
            mensaje: Esta conversación está cerrada. Abra una nueva si algo cambió.
            correlacionId: 5b6a7f8e-9d0c-4e1f-8a2b-4c5d6e7f8a9b
    PrecondicionFallida:
      description: |
        El `If-Match` no coincide con la versión actual: otra persona modificó el recurso
        (`VERSION_DESACTUALIZADA`). El cliente debe volver a leerlo.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: VERSION_DESACTUALIZADA
            mensaje: Alguien más cambió esta conversación. Revise los cambios e intente de nuevo.
            correlacionId: 6c7b8a9f-0e1d-4f2a-9b3c-5d6e7f8a9b0c
    ArchivoDemasiadoGrande:
      description: El cuerpo pesa más de 1 048 576 bytes (`ARCHIVO_INVALIDO`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ArchivoInvalido:
      description: |
        El archivo no es JPEG, por `Content-Type` o porque sus bytes iniciales no son los de un
        JPEG (`ARCHIVO_INVALIDO`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TipoNoAdmitido:
      description: |
        El `Content-Type` no es el que acepta la operación: `application/json`, o
        `application/merge-patch+json` en los PATCH (`TIPO_NO_ADMITIDO`).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DatosInvalidos:
      description: |
        JSON legible que viola el esquema o una regla de negocio: `DATOS_INVALIDOS` (con
        `campos`), `FOTO_RECHAZADA` (con `motivo`), `CONVERSACION_INCOMPLETA` (con
        `puntosFaltantes`), `ENLACE_INVALIDO` (token de enlace vencido o ya usado, con
        `motivo`) o `CLAVE_REUTILIZADA` (`Idempotency-Key` repetida con otro cuerpo).
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            datosInvalidos:
              value:
                codigo: DATOS_INVALIDOS
                mensaje: Revise la fecha de nacimiento.
                correlacionId: 7d8c9b0a-1f2e-4a3b-8c4d-6e7f8a9b0c1d
                campos:
                  - campo: fechaNacimiento
                    mensaje: Revise la fecha de nacimiento.
            fotoRechazada:
              value:
                codigo: FOTO_RECHAZADA
                mensaje: La foto salió borrosa. Acérquese y mantenga el teléfono quieto.
                correlacionId: 8e9d0c1b-2a3f-4b4c-9d5e-7f8a9b0c1d2e
                motivo: borrosa
            conversacionIncompleta:
              value:
                codigo: CONVERSACION_INCOMPLETA
                mensaje: Faltan datos para enviar la conversación.
                correlacionId: 9f0e1d2c-3b4a-4c5d-8e6f-8a9b0c1d2e3f
                puntosFaltantes:
                  - tipo: pregunta
                    referencia: G1
                    mensaje: 'Falta: ¿Desde cuándo?'
            enlaceInvalido:
              value:
                codigo: ENLACE_INVALIDO
                mensaje: El enlace venció. Solicite uno nuevo.
                correlacionId: 0a1b2c3d-4e5f-4a6b-8c7d-8e9f0a1b2c3d
                motivo: vencido
    Bloqueado:
      description: |
        Demasiadas solicitudes (`BLOQUEADO`): en `/sesiones`, `MAX_INTENTOS_LOGIN` fallos por
        correo e IP; en los endpoints públicos que envían correos o aceptan tokens, un límite
        de frecuencia por IP.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
        Retry-After:
          description: Segundos que faltan para desbloquear.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ErrorInterno:
      description: Error no previsto. No incluye trazas internas y no deja datos a medias.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: ERROR_INTERNO
            mensaje: Algo salió mal. Intente de nuevo.
            correlacionId: a01b2c3d-4e5f-4a6b-9c7d-9b0c1d2e3f4a

  schemas:
    # ───── Tipos básicos ─────
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      example: 66f1c0a2b3d4e5f6a7b8c9d0
    FechaHora:
      type: string
      format: date-time
      description: UTC; el cliente la muestra en America/Mexico_City.
    Rol:
      type: string
      enum: [cuidador_principal, cocuidador, medico, administrador]
    CodigoEtiqueta:
      type: string
      description: Código de una etiqueta del catálogo (se pueden agregar etiquetas sin cambiar la API).
      pattern: '^[a-z_]{2,30}$'
      example: fiebre
    EstadoConversacion:
      type: string
      enum: [BORRADOR, ENVIADA, EN_REVISION, INFO_SOLICITADA, CON_INDICACIONES, CERRADA, SIN_MEDICO]
    SeccionBandeja:
      type: string
      enum: [prioridad_familia, esperan_respuesta, esperando_familia]
    EstadoInvitacion:
      type: string
      enum: [pendiente, aceptada, rechazada, vencida, cancelada]
    TipoReporte:
      type: string
      enum: [abuso, tecnico]
    Paginacion:
      type: object
      required: [pagina, limite, total]
      properties:
        pagina: { type: integer, minimum: 1 }
        limite: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    # ───── Errores ─────
    Error:
      type: object
      required: [codigo, mensaje, correlacionId]
      properties:
        codigo:
          type: string
          enum:
            - SOLICITUD_MALFORMADA
            - TIPO_NO_ADMITIDO
            - NO_AUTENTICADO
            - SIN_PERMISOS
            - CUENTA_NO_VERIFICADA
            - AVISO_PENDIENTE
            - CUENTA_DESACTIVADA
            - NO_ENCONTRADO
            - TRANSICION_INVALIDA
            - LIMITE_ALCANZADO
            - CONSENTIMIENTO_PENDIENTE
            - CORREO_REGISTRADO
            - SOLICITUD_EN_CURSO
            - VERSION_DESACTUALIZADA
            - ENLACE_INVALIDO
            - ARCHIVO_INVALIDO
            - DATOS_INVALIDOS
            - FOTO_RECHAZADA
            - CONVERSACION_INCOMPLETA
            - CLAVE_REUTILIZADA
            - BLOQUEADO
            - ERROR_INTERNO
        mensaje:
          type: string
          description: Texto que muestra el cliente.
        correlacionId: { type: string, format: uuid }
        campos:
          type: array
          description: Solo con `DATOS_INVALIDOS`.
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: { type: string }
              mensaje: { type: string }
        puntosFaltantes:
          type: array
          description: Solo con `CONVERSACION_INCOMPLETA`.
          items: { $ref: '#/components/schemas/PuntoPendiente' }
        motivo:
          type: string
          description: Con `FOTO_RECHAZADA` (`borrosa`, `oscura`) o `ENLACE_INVALIDO` (`vencido`, `usado`).
          enum: [borrosa, oscura, vencido, usado]
        sugerencia:
          type: string
          description: Acción que el cliente puede ofrecer (por ejemplo, `agregar_adulto` en RF-04-AC-5).
          enum: [agregar_adulto, borrar_conversacion]

    # ───── Autenticación y cuenta ─────
    Credenciales:
      type: object
      required: [correo, contrasena]
      properties:
        correo: { type: string, format: email, example: ana@example.com }
        contrasena: { type: string, format: password }
    Declaraciones:
      type: object
      required: [mayorDeEdad, consentimientoDatosPropios, consentimientoDatosMenores]
      properties:
        mayorDeEdad:
          type: boolean
          description: Declara ser mayor de 18 años. Debe ser `true`.
        consentimientoDatosPropios:
          type: boolean
          description: Consiente el tratamiento de sus datos de salud. Debe ser `true`.
        consentimientoDatosMenores:
          type: boolean
          description: Consiente, como madre, padre o tutor, el tratamiento de los datos de los menores. Debe ser `true`.
    RegistroFamilia:
      type: object
      description: Registro del cuidador principal (crea la familia).
      additionalProperties: false
      required: [nombre, correo, contrasena, declaraciones, avisoVersion]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80, example: Ana López }
        correo: { type: string, format: email, example: ana@example.com }
        contrasena: { type: string, format: password, minLength: 8 }
        declaraciones: { $ref: '#/components/schemas/Declaraciones' }
        avisoVersion: { type: integer, minimum: 1, example: 1 }
    RegistroPorInvitacion:
      type: object
      additionalProperties: false
      required: [tokenInvitacion, nombre, contrasena]
      description: |
        `declaraciones` es obligatoria si la invitación es de cocuidador;
        `aceptaTerminosMedico` debe ser `true` si es de médico.
      properties:
        tokenInvitacion: { type: string, minLength: 32 }
        nombre: { type: string, minLength: 1, maxLength: 80 }
        contrasena: { type: string, format: password, minLength: 8 }
        declaraciones: { $ref: '#/components/schemas/Declaraciones' }
        aceptaTerminosMedico: { type: boolean }
        especialidad: { type: string, maxLength: 80, example: Pediatría }
        avisoVersion: { type: integer, minimum: 1 }
    SesionCreada:
      type: object
      required: [accessToken, tipoToken, expiraEnSegundos, usuario, pantallaInicio]
      properties:
        accessToken: { type: string, description: "JWT para la cabecera `Authorization: Bearer <token>`." }
        tipoToken: { type: string, enum: [Bearer] }
        expiraEnSegundos:
          type: integer
          description: Tiempo máximo de inactividad (`MINUTOS_SESION` × 60).
          example: 1800
        usuario: { $ref: '#/components/schemas/Cuenta' }
        pantallaInicio:
          type: string
          enum: [perfiles, bandeja, reportes]
    Cuenta:
      type: object
      required: [id, nombre, correo, rol, correoVerificado, activo]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        nombre: { type: string }
        correo: { type: string, format: email }
        rol: { $ref: '#/components/schemas/Rol' }
        familiaId:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          type: string
          nullable: true
        especialidad: { type: string, nullable: true }
        correoVerificado: { type: boolean }
        activo: { type: boolean }
        avisoAceptadoVersion: { type: integer }
        avisoPendienteVersion:
          type: integer
          nullable: true
          description: Versión del aviso que el usuario debe aceptar antes de enviar conversaciones o mensajes.
    AceptacionAviso:
      type: object
      required: [usuarioId, version, aceptadoEn]
      properties:
        usuarioId: { $ref: '#/components/schemas/ObjectId' }
        version: { type: integer }
        aceptadoEn: { $ref: '#/components/schemas/FechaHora' }
    TokenEnlace:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32 }
    UsuarioAdmin:
      type: object
      description: Vista del administrador; sin datos de salud.
      required: [id, rol, activo]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        rol: { $ref: '#/components/schemas/Rol' }
        activo: { type: boolean }
        desactivadoEn:
          allOf: [{ $ref: '#/components/schemas/FechaHora' }]
          type: string
          nullable: true

    # ───── Familias ─────
    FamiliaResumen:
      type: object
      required: [id, nombre]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        nombre: { type: string, example: Familia López }
        tieneCocuidador: { type: boolean }
        totalPerfiles: { type: integer, minimum: 0 }
    Miembro:
      type: object
      required: [usuarioId, nombre, rol]
      properties:
        usuarioId: { $ref: '#/components/schemas/ObjectId' }
        nombre: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        especialidad: { type: string, nullable: true }
        leyenda:
          type: string
          nullable: true
          description: «Contacto agregado por usted» para médicos (RD-03).
          example: Contacto agregado por usted
        desde: { $ref: '#/components/schemas/FechaHora' }
    Privacidad:
      type: object
      required: [perfiles, diasRetencionRespaldo, avisoPrivacidad]
      properties:
        perfiles:
          type: array
          items:
            type: object
            required: [perfilId, nombre, datosGuardados, medicos, resumenActivo]
            properties:
              perfilId: { $ref: '#/components/schemas/ObjectId' }
              nombre: { type: string }
              datosGuardados:
                type: array
                items: { type: string }
                example: [nombre, fecha de nacimiento, alergias, medicamentos, conversaciones, fotos]
              medicos:
                type: array
                items: { $ref: '#/components/schemas/PermisoHistorial' }
              resumenActivo: { type: boolean }
        diasRetencionRespaldo: { type: integer, example: 7 }
        avisoPrivacidad: { $ref: '#/components/schemas/Aviso' }
    ResumenBorrado:
      type: object
      required: [borrado, conservado, diasRetencionRespaldo]
      properties:
        borrado:
          type: object
          properties:
            perfiles: { type: integer }
            conversaciones: { type: integer }
            fotos: { type: integer }
            cuentaCocuidador: { type: boolean }
        conservado:
          type: object
          properties:
            registrosMinimos:
              type: integer
              description: Conversaciones enviadas de las que queda identificador, fecha de envío y de borrado.
        diasRetencionRespaldo: { type: integer, example: 7 }

    # ───── Invitaciones ─────
    InvitacionNueva:
      type: object
      required: [tipo, correo]
      properties:
        tipo:
          type: string
          enum: [cocuidador, medico]
        correo: { type: string, format: email }
    Invitacion:
      type: object
      required: [id, familiaId, tipo, correo, estado, venceEn]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        familiaId: { $ref: '#/components/schemas/ObjectId' }
        familiaNombre: { type: string }
        tipo:
          type: string
          enum: [cocuidador, medico]
        correo: { type: string, format: email }
        estado: { $ref: '#/components/schemas/EstadoInvitacion' }
        creadaEn: { $ref: '#/components/schemas/FechaHora' }
        venceEn: { $ref: '#/components/schemas/FechaHora' }

    # ───── Perfiles ─────
    PerfilNuevo:
      type: object
      required: [tipo, nombre, fechaNacimiento]
      properties:
        tipo:
          type: string
          enum: [menor, propio, adulto_representado]
        nombre: { type: string, minLength: 1, maxLength: 80, example: Mateo }
        fechaNacimiento: { type: string, format: date, example: '2021-03-12' }
        alergias:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 100 }
          example: [penicilina]
        medicamentos:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 100 }
          example: [Salbutamol inhalado]
        correo:
          type: string
          format: email
          description: Obligatorio para `adulto_representado`; recibe el enlace de consentimiento.
        compartirConCocuidador:
          type: boolean
          default: false
          description: Solo aplica a perfiles `propio` y `adulto_representado`.
    PerfilActualizacion:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        fechaNacimiento: { type: string, format: date }
        alergias:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 100 }
        medicamentos:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 100 }
        compartirConCocuidador: { type: boolean }
        resumenActivo: { type: boolean }
    Perfil:
      type: object
      required: [id, familiaId, tipo, nombre, fechaNacimiento, edadAnios, estado, resumenActivo]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        familiaId: { $ref: '#/components/schemas/ObjectId' }
        tipo:
          type: string
          enum: [menor, propio, adulto_representado]
        nombre: { type: string }
        fechaNacimiento: { type: string, format: date }
        edadAnios: { type: integer, minimum: 0, example: 5 }
        alergias:
          type: array
          items: { type: string }
        medicamentos:
          type: array
          items: { type: string }
        estado:
          type: string
          enum: [activo, pendiente_consentimiento]
        compartirConCocuidador: { type: boolean }
        resumenActivo: { type: boolean }
    PermisoHistorial:
      type: object
      required: [perfilId, medicoId, compartirHistorial]
      properties:
        perfilId: { $ref: '#/components/schemas/ObjectId' }
        medicoId: { $ref: '#/components/schemas/ObjectId' }
        medicoNombre: { type: string }
        compartirHistorial: { type: boolean }
        actualizadoEn: { $ref: '#/components/schemas/FechaHora' }
    Consentimiento:
      type: object
      required: [perfilId, avisoVersion, otorgadoEn]
      properties:
        perfilId: { $ref: '#/components/schemas/ObjectId' }
        avisoVersion: { type: integer }
        otorgadoEn: { $ref: '#/components/schemas/FechaHora' }

    # ───── Conversaciones ─────
    ConversacionNueva:
      type: object
      description: El perfil sale del path (`/perfiles/{perfilId}/conversaciones`).
      required: [etiquetas, medicoId, titulo]
      properties:
        etiquetas:
          type: array
          minItems: 1
          uniqueItems: true
          description: De una a tres; una cuarta responde `LIMITE_ALCANZADO`.
          items: { $ref: '#/components/schemas/CodigoEtiqueta' }
          example: [fiebre]
        medicoId: { $ref: '#/components/schemas/ObjectId' }
        titulo: { type: string, minLength: 1, maxLength: 80, example: Fiebre desde anoche }
        prioridadIndicada:
          type: boolean
          default: false
          description: «Necesito respuesta pronto». Es decisión de la familia; DAFI no la evalúa.
    ConversacionActualizacion:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titulo: { type: string, minLength: 1, maxLength: 80 }
        etiquetas:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/CodigoEtiqueta' }
        medicoId: { $ref: '#/components/schemas/ObjectId' }
        prioridadIndicada: { type: boolean }
    EnvioNuevo:
      type: object
      additionalProperties: false
      description: Vacío para enviar un borrador; con `medicoId` para redirigir una conversación `SIN_MEDICO`.
      properties:
        medicoId: { $ref: '#/components/schemas/ObjectId' }
    Cierre:
      type: object
      required: [conversacionId, estado, cerradaEn, cerradaPor]
      properties:
        conversacionId: { $ref: '#/components/schemas/ObjectId' }
        estado:
          type: string
          enum: [CERRADA]
        cerradaEn: { $ref: '#/components/schemas/FechaHora' }
        cerradaPor: { $ref: '#/components/schemas/PersonaRef' }
    PuntoPendiente:
      type: object
      required: [tipo, mensaje]
      properties:
        tipo:
          type: string
          enum: [pregunta, medico, consentimiento]
        referencia:
          type: string
          description: Código de la pregunta, si aplica.
          example: G2
        mensaje: { type: string, example: 'Falta: ¿Qué le preocupa?' }
    PersonaRef:
      type: object
      required: [id, nombre, rol]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        nombre: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        leyenda:
          type: string
          nullable: true
          example: Contacto agregado por usted
    ConversacionResumen:
      type: object
      required: [id, familiaId, perfil, etiquetas, medico, titulo, estado, prioridadIndicada, creadaEn]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        familiaId: { $ref: '#/components/schemas/ObjectId' }
        familiaNombre: { type: string }
        perfil:
          type: object
          required: [id, nombre]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            nombre: { type: string }
        etiquetas:
          type: array
          items: { $ref: '#/components/schemas/CodigoEtiqueta' }
        medico: { $ref: '#/components/schemas/PersonaRef' }
        titulo: { type: string }
        estado: { $ref: '#/components/schemas/EstadoConversacion' }
        prioridadIndicada: { type: boolean }
        seccionBandeja:
          allOf: [{ $ref: '#/components/schemas/SeccionBandeja' }]
          type: string
          nullable: true
          description: Solo en la bandeja del médico.
        soloLectura:
          type: boolean
          description: Verdadero cuando el médico la ve por «Compartir historial».
        indicacionVigente:
          allOf: [{ $ref: '#/components/schemas/Indicacion' }]
          type: object
          nullable: true
        creadaEn: { $ref: '#/components/schemas/FechaHora' }
        enviadaEn:
          allOf: [{ $ref: '#/components/schemas/FechaHora' }]
          type: string
          nullable: true
        ultimoEventoEn: { $ref: '#/components/schemas/FechaHora' }
    ConversacionDetalle:
      allOf:
        - $ref: '#/components/schemas/ConversacionResumen'
        - type: object
          required: [preguntas, fotos, puntosPendientes, mostrarAvisoEmergencias]
          properties:
            perfilDetalle: { $ref: '#/components/schemas/Perfil' }
            preguntas:
              type: array
              items: { $ref: '#/components/schemas/PreguntaConRespuesta' }
            fotos:
              type: array
              items: { $ref: '#/components/schemas/Foto' }
            puntosPendientes:
              type: array
              description: Vacío cuando el borrador se puede enviar (RF-12).
              items: { $ref: '#/components/schemas/PuntoPendiente' }
            mostrarAvisoEmergencias:
              type: boolean
              description: Verdadero para la familia en toda conversación que no esté `CERRADA`.
            avisoEmergencias: { $ref: '#/components/schemas/Aviso' }
    PaginaConversaciones:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/ConversacionResumen' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    # ───── Preguntas, respuestas, fotos, eventos ─────
    Pregunta:
      type: object
      required: [id, texto, tipoRespuesta, obligatoria]
      properties:
        id: { type: string, example: F1 }
        texto: { type: string, example: Temperatura más alta que midió }
        tipoRespuesta:
          type: string
          enum: [opcion, texto, numero_u_opcion, opcion_con_texto, zona_cuerpo]
        opciones:
          type: array
          items: { type: string }
        obligatoria: { type: boolean }
        etiqueta:
          type: string
          nullable: true
          description: Nulo para las preguntas generales.
    PreguntaConRespuesta:
      allOf:
        - $ref: '#/components/schemas/Pregunta'
        - type: object
          properties:
            respuesta:
              allOf: [{ $ref: '#/components/schemas/Respuesta' }]
              type: object
              nullable: true
    Cuestionario:
      type: object
      required: [preguntas, referenciaPerfil]
      properties:
        preguntas:
          type: array
          items: { $ref: '#/components/schemas/PreguntaConRespuesta' }
        referenciaPerfil:
          type: object
          description: Alergias y medicamentos del perfil, mostrados como referencia sobre G3.
          properties:
            alergias:
              type: array
              items: { type: string }
            medicamentos:
              type: array
              items: { type: string }
    RespuestaEntrada:
      type: object
      minProperties: 1
      description: Se usa el campo que corresponda al `tipoRespuesta` de la pregunta.
      properties:
        opcion: { type: string, example: si }
        texto: { type: string, maxLength: 2000, example: Paracetamol }
        numero: { type: number, minimum: 30, maximum: 45, example: 39.5 }
    Respuesta:
      type: object
      required: [preguntaId, autor, registradaEn]
      properties:
        preguntaId: { type: string, example: G3 }
        opcion: { type: string, nullable: true }
        texto: { type: string, nullable: true }
        numero: { type: number, nullable: true }
        autor: { $ref: '#/components/schemas/PersonaRef' }
        registradaEn: { $ref: '#/components/schemas/FechaHora' }
    Foto:
      type: object
      required: [id, conversacionId, url, bytes, zonaSensible, subidaEn]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        conversacionId: { $ref: '#/components/schemas/ObjectId' }
        url:
          type: string
          description: Ruta relativa de la API; exige token (no es pública).
          example: /api/v1/conversaciones/66f1c0a2b3d4e5f6a7b8c9d0/fotos/66f1c0a2b3d4e5f6a7b8c9d1
        bytes: { type: integer, maximum: 1048576 }
        anchoPx: { type: integer }
        altoPx: { type: integer }
        zonaSensible:
          type: boolean
          description: Verdadero si P1 es «zona del pañal o genital»; se ve sin descarga y no va al módulo de resumen.
        autor: { $ref: '#/components/schemas/PersonaRef' }
        subidaEn: { $ref: '#/components/schemas/FechaHora' }
    MensajeNuevo:
      type: object
      description: Debe llevar `texto`, `fotoIds` o ambos.
      minProperties: 1
      properties:
        texto: { type: string, minLength: 1, maxLength: 4000 }
        fotoIds:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ObjectId' }
        respondeASolicitud:
          type: boolean
          default: false
          description: La familia responde la solicitud de información vigente.
    SolicitudInformacionNueva:
      type: object
      required: [texto, tipo]
      properties:
        texto: { type: string, minLength: 1, maxLength: 2000, example: Mándeme una foto con una moneda al lado }
        tipo:
          type: string
          enum: [fotos, respuesta, ambas]
    IndicacionNueva:
      type: object
      required: [texto]
      properties:
        texto:
          type: string
          minLength: 1
          maxLength: 4000
          example: Paracetamol según su peso cada 6 horas; si sigue igual mañana, me escribe.
        decision:
          type: string
          nullable: true
          enum: [cuidado_en_casa, consulta_presencial, acudir_a_urgencias]
        plazoDias:
          type: integer
          minimum: 1
          maximum: 90
          description: Obligatorio cuando `decision` es `consulta_presencial`.
    Indicacion:
      type: object
      required: [id, texto, medico, registradaEn, vigente]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        texto: { type: string }
        decision:
          type: string
          nullable: true
          enum: [cuidado_en_casa, consulta_presencial, acudir_a_urgencias]
        plazoDias: { type: integer, nullable: true }
        medico: { $ref: '#/components/schemas/PersonaRef' }
        registradaEn: { $ref: '#/components/schemas/FechaHora' }
        vigente: { type: boolean }
    Evento:
      type: object
      required: [id, conversacionId, tipo, autor, fecha]
      description: Entrada fechada de la conversación. Los campos presentes dependen de `tipo`.
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        conversacionId: { $ref: '#/components/schemas/ObjectId' }
        tipo:
          type: string
          enum: [respuesta, mensaje, foto, solicitud_informacion, indicacion, cambio_estado, cita_marcada]
        autor:
          allOf: [{ $ref: '#/components/schemas/PersonaRef' }]
          description: En eventos del sistema, `rol` es `administrador` y `nombre` es «DAFI».
        fecha: { $ref: '#/components/schemas/FechaHora' }
        texto: { type: string, nullable: true }
        preguntaId: { type: string, nullable: true }
        fotoIds:
          type: array
          items: { $ref: '#/components/schemas/ObjectId' }
        estadoAnterior:
          allOf: [{ $ref: '#/components/schemas/EstadoConversacion' }]
          type: string
          nullable: true
        estadoNuevo:
          allOf: [{ $ref: '#/components/schemas/EstadoConversacion' }]
          type: string
          nullable: true
        indicacion:
          allOf: [{ $ref: '#/components/schemas/Indicacion' }]
          type: object
          nullable: true
    PaginaAccesos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/Acceso' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }
    PaginaEventos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/Evento' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }
    Acceso:
      type: object
      required: [medico, recurso, fecha]
      properties:
        medico: { $ref: '#/components/schemas/PersonaRef' }
        recurso:
          type: string
          enum: [conversacion, foto]
        fotoId:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          type: string
          nullable: true
        fecha: { $ref: '#/components/schemas/FechaHora' }

    # ───── Resumen de contexto ─────
    IdCita:
      type: string
      description: SHA-256 en hexadecimal de `eventoId` + `texto`. Es estable entre regeneraciones del resumen.
      pattern: '^[a-f0-9]{64}$'
      example: 9c1185a5c5e9fc54612808977ee8f548b2258d31a1f0e2f6f2e7bb2d3c5a0f4e
    Cita:
      type: object
      required: [id, texto, autor, fecha, eventoId, enlace]
      properties:
        id: { $ref: '#/components/schemas/IdCita' }
        texto:
          type: string
          description: Fragmento copiado sin cambios del evento de origen.
          example: Use crema de óxido de zinc dos veces al día
        autor: { $ref: '#/components/schemas/PersonaRef' }
        fecha: { $ref: '#/components/schemas/FechaHora' }
        eventoId: { $ref: '#/components/schemas/ObjectId' }
        conversacionOrigenId: { $ref: '#/components/schemas/ObjectId' }
        enlace:
          type: string
          description: URL del evento de origen.
          example: /api/v1/conversaciones/66f1c0a2b3d4e5f6a7b8c9d0/eventos/66f1c0a2b3d4e5f6a7b8c9d2
        marcadaIncorrecta: { type: boolean, default: false }
    DatoPerfil:
      type: object
      required: [tipo, texto, fuente]
      properties:
        tipo:
          type: string
          enum: [alergia, medicamento]
        texto: { type: string, example: penicilina }
        fuente:
          type: string
          enum: [Perfil]
    ResumenContexto:
      type: object
      required: [titulo, estado, alergiasYMedicamentos]
      properties:
        titulo:
          type: string
          example: Resumen automático del historial. Verifique en los mensajes originales.
        estado:
          type: string
          enum: [disponible, desactivado_por_familia, no_disponible]
        mensaje:
          type: string
          nullable: true
          description: |
            «La familia desactivó el resumen automático», «Resumen no disponible. Puede
            consultar el historial completo.» o «No hay conversaciones anteriores que pueda ver.»
        alergiasYMedicamentos:
          type: array
          items: { $ref: '#/components/schemas/DatoPerfil' }
        episodiosAnteriores:
          type: array
          items: { $ref: '#/components/schemas/Cita' }
        indicacionesPrevias:
          type: array
          items: { $ref: '#/components/schemas/Cita' }
        modelo:
          type: object
          nullable: true
          description: Proveedor y versión del modelo que generó el resumen.
          properties:
            proveedor: { type: string }
            version: { type: string }
        generadoEn:
          allOf: [{ $ref: '#/components/schemas/FechaHora' }]
          type: string
          nullable: true

    # ───── Notificaciones ─────
    Notificacion:
      type: object
      required: [id, tipo, texto, leida, creadaEn]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        tipo:
          type: string
          enum:
            - conversacion_enviada
            - info_solicitada
            - respuesta_familia
            - mensaje_medico
            - indicaciones
            - sin_respuesta
            - conversacion_borrada
            - consentimiento
            - cocuidador_salio
            - medico_salio
        texto: { type: string }
        conversacionId:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          type: string
          nullable: true
        leida: { type: boolean }
        creadaEn: { $ref: '#/components/schemas/FechaHora' }
    PaginaNotificaciones:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/Notificacion' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    # ───── Reportes ─────
    ReporteNuevo:
      type: object
      required: [tipo, descripcion]
      properties:
        tipo: { $ref: '#/components/schemas/TipoReporte' }
        descripcion: { type: string, minLength: 1, maxLength: 2000, example: No es médico }
        cuentaReportadaId:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          description: Obligatorio cuando `tipo` es `abuso`.
        conversacionId:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          description: Conversación desde la que se reporta; el administrador no ve su contenido.
        pantalla:
          type: string
          description: Pantalla en la que estaba el usuario (reportes técnicos).
        ultimoCorrelacionId:
          type: string
          format: uuid
          description: Identificador de correlación del último error (reportes técnicos).
    Reporte:
      type: object
      required: [id, tipo, descripcion, rolReportante, creadoEn, atendido]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        tipo: { $ref: '#/components/schemas/TipoReporte' }
        descripcion: { type: string }
        reportanteId: { $ref: '#/components/schemas/ObjectId' }
        rolReportante: { $ref: '#/components/schemas/Rol' }
        cuentaReportadaId:
          allOf: [{ $ref: '#/components/schemas/ObjectId' }]
          type: string
          nullable: true
        pantalla: { type: string, nullable: true }
        ultimoCorrelacionId: { type: string, format: uuid, nullable: true }
        creadoEn: { $ref: '#/components/schemas/FechaHora' }
        atendido: { type: boolean }
    PaginaReportes:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/Reporte' }
        paginacion: { $ref: '#/components/schemas/Paginacion' }

    # ───── Catálogos ─────
    Etiqueta:
      type: object
      required: [codigo, nombre, preguntas]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoEtiqueta' }
        nombre: { type: string, example: Fiebre }
        preguntas:
          type: array
          items: { $ref: '#/components/schemas/Pregunta' }
    Salud:
      type: object
      required: [estado, baseDatos, version, hora]
      properties:
        estado:
          type: string
          enum: [ok, degradado]
        baseDatos:
          type: string
          enum: [ok, sin_conexion]
        version: { type: string, example: 1.1.0 }
        hora: { $ref: '#/components/schemas/FechaHora' }
    Aviso:
      type: object
      required: [codigo, texto, version]
      properties:
        codigo:
          type: string
          enum: [emergencias, que-es-dafi, sin-respuesta, privacidad]
        titulo: { type: string, nullable: true }
        texto:
          type: string
          example: DAFI no atiende emergencias. Si la persona tiene dificultad para respirar, pierde el conocimiento o la situación le preocupa, llame al 911 o acuda a urgencias.
        version: { type: integer, example: 1 }
        accion:
          type: object
          nullable: true
          description: Botón asociado, por ejemplo «Llamar al 911».
          properties:
            etiqueta: { type: string, example: Llamar al 911 }
            enlace: { type: string, example: 'tel:911' }
        revisadoPor:
          type: string
          nullable: true
          description: Médico que revisó el texto (RD-05).
        publicadoEn: { $ref: '#/components/schemas/FechaHora' }
